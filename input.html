<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input></title>
    <link rel="stylesheet" href="stylefrom.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *{
            box-sizing:border-box ;
        }
        header{
            background-color: rgb(193, 247, 247);
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: rgb(0, 0, 0);
        }
        article{
            background-color: aquamarine;
            float: left;
            width: 70%;
            height: auto;
            padding: 10px;
        }
        nav ul{
            list-style-type: circle;
            padding: 0%;
        }
        section::after {
            content: "";
            display: table;
            clear: both;
        }
        a{
            text-decoration: none;
            color: black;
        } 
        nav{
            background-color: rgb(202, 255, 242);
            float: left;
            width: 30%;
            height: 500px;
            padding: 20px;
      }
        footer{
            background-color:rgb(47, 241, 255) ;
            padding: 20px;
            text-align: center;
        }
        @media (max-width: 600px)  {
            nav, article  {
                width: 100%;
                height: 300px;
            }
        }

    </style>
</head>
<body>
    <header>
        HEADER
    </header>
    <section>
        <nav>
            <ul>
                <li><A href="https://www.kmutnb.ac.th/faculty-and-agencies/bangkok.aspx">KMUTNB</A></li>
                <li><A href="https://www.facebook.com/FITM.KMUTNB">FITM</A></li>
                <li><A href="https://www.facebook.com/chanachai.ccc">FACEBOOK</A></li>
                <li><A href="input.html">INPUT</A></li>
                <li><A href="layout.html">Latouy</A></li>
            </ul>    
        </nav>
        <article>
        <h1>INPUT FROM</h1>
        <form action="#">
            <label for="">username : </label><br>
            <input type="text"name=""id=""><br>
            <label for="">password : </label><br>
            <input type="text"name=""id=""><br>
            <label for="">email : </label><br>
            <input type="text"name=""id=""><br><br>
            <label for="phone">Enter your phone number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"><br><br>
            <label for="quantity">Weight : </label>
            <input type="number" id="quantity" name="quantity" min="25" max="200">
            <label for="quantity">height : </label>
            <input type="number" id="quantity" name="quantity" min="100" max="250">
            <br><br>
            <label for="birthday">Birthday:</label>
            <input type="date" id="birthday" name="birthday">
            <br><br>
            
            <!--tnput file-->
            
            <label for="myfile">รูปภาพนักศึกษา:</label>
            <input type="file" id="myfile" name="myfile">
            <br><br>
            
            <!--radio-->
            
            <input type="radio" id="html" name="Graduate" value="ม.6">
            <label for="html">ม.6</label><br>
            <input type="radio" id="css" name="Graduate" value="ปวช.">
            <label for="css">ปวช.</label><br>
            <input type="radio" id="javascript" name="Graduate" value="ปวส.">
            <label for="javascript">ปวส.</label>
            <br><br>
            
            <!--checkbox-->
            
            <input type="checkbox" id="vehicle1" name="Major1" value="IT">
            <label for="vehicle1"> IT</label><br>
            <input type="checkbox" id="vehicle1" name="Major2" value="ITI">
            <label for="vehicle1"> ITI</label><br>
            <input type="checkbox" id="vehicle1" name="Major3" value="INE">
            <label for="vehicle1"> INE</label><br>
            <input type="checkbox" id="vehicle1" name="Major3" value="INE">
            <label for="vehicle1"> INET</label><br>
            <br>    
            <label for="vol">Volume (between 0 and 50):</label>
            <input type="range" id="vol" name="vol" min="0" max="50">
            
            <button type="button" class="btn btn-outline-success">Success</button>
            <button type="button" class="btn btn-outline-warning">Warning</button>
            <button type="button" class="btn btn-outline-danger">Danger</button>
            
            <br><br>
            <input type="button" value="Submit">
            <input type="button" value="Reset">
        </form>
        </article>
    </section>
    <footer>
        ขอข้อสอบ DOS Linux หน่อยครับ
    </footer>
</body>
</html>
